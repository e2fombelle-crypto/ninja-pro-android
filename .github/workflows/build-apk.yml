
name: Build NINJA PRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet Android
        run: unzip -q NINJA_PRO_Android.zip -d unpacked

      - name: Compiler l'APK
        working-directory: unpacked/NINJA_PRO_Android/android-app
        run: gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-PRO-APK
          path: unpacked/NINJA_PRO_Android/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
